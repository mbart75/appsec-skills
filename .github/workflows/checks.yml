name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Scripts, installers, SQL bench, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck (shipped and bench scripts; bench/vulnerable-app is flawed on purpose)
        run: shellcheck install.sh scripts/*.sh skills/appsec-review/scripts/*.sh tests/*.sh bench/setup.sh bench/*/setup.sh bench/rls-sql/run.sh

      - name: Python
        run: |
          python3 -m py_compile skills/appsec-review/scripts/cve-priority.py
          python3 bench/check-key.py

      - name: PSScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Warning, Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }

      - name: Installers on a throwaway home
        run: |
          home="$(mktemp -d)"; mkdir -p "$home/.codex"
          HOME="$home" bash install.sh --agents codex --yes
          test -f "$home/.codex/skills/appsec-review/SKILL.md"
          HOME="$home" bash install.sh --agents codex --uninstall --yes
          test ! -e "$home/.codex/skills/appsec-review"
          pwsh -NoProfile -File install.ps1 -Dir "$home/custom[1]" -Yes
          test -f "$home/custom[1]/appsec-review/SKILL.md"

      - name: Secret scan cannot be silenced by the reviewed repository
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          bin="$(mktemp -d)"
          curl -fsSL -o "$bin/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $bin/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$bin/gitleaks.tar.gz" -C "$bin" gitleaks
          PATH="$bin:$PATH" bash tests/run-scanners-gitleaks.sh

      - name: TruffleHog cannot be silenced, no secret in scanner outputs
        env:
          TRUFFLEHOG_VERSION: 3.99.2
          TRUFFLEHOG_SHA256: 3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4
        run: |
          bin="$(mktemp -d)"
          curl -fsSL -o "$bin/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $bin/trufflehog.tar.gz" | sha256sum -c -
          tar -xzf "$bin/trufflehog.tar.gz" -C "$bin" trufflehog
          # Bandit and its dependencies: nothing published in the last 7 days.
          python3 -m venv "$bin/venv"
          "$bin/venv/bin/pip" install --quiet pip==26.2.1
          "$bin/venv/bin/pip" install --quiet --uploaded-prior-to P7D bandit==1.9.4
          PATH="$bin:$bin/venv/bin:$PATH" bash tests/run-scanners-secrets.sh

      - name: Checkov cannot be configured by the reviewed repository
        env:
          CHECKOV_VERSION: 3.3.29
        run: |
          venv="$(mktemp -d)"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet "checkov==${CHECKOV_VERSION}"
          PATH="$venv/bin:$PATH" bash tests/run-scanners-checkov.sh

      - name: --offline keeps OSV-Scanner offline
        run: bash tests/run-scanners-osv-offline.sh

      - name: The commands for looking at a secret print no secret
        run: bash tests/secret-recipes.sh

      - name: PSScriptAnalyzer cannot be configured by the reviewed repository
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          bash tests/run-scanners-psscriptanalyzer.sh
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Other scanners cannot be configured by the reviewed repository
        env:
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
          OSV_SCANNER_VERSION: 2.7.0
          OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          bin="$(mktemp -d)"
          curl -fsSL -o "$bin/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $bin/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$bin/trivy.tar.gz" -C "$bin" trivy
          curl -fsSL -o "$bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin/osv-scanner" | sha256sum -c -
          chmod +x "$bin/osv-scanner"
          # Semgrep, Bandit, zizmor and their dependencies: nothing published in the last 7 days.
          python3 -m venv "$bin/venv"
          "$bin/venv/bin/pip" install --quiet pip==26.2.1
          "$bin/venv/bin/pip" install --quiet --uploaded-prior-to P7D semgrep==1.181.0 bandit==1.9.4 zizmor==1.31.1
          pwsh -NoProfile -Command 'Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force'
          shellcheck --version
          PATH="$bin:$bin/venv/bin:$PATH" APPSEC_TEST_REQUIRE_ALL=1 bash tests/run-scanners-repo-settings.sh

      - name: Supabase SQL on PostgreSQL
        run: PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)" bash bench/rls-sql/run.sh

      - name: Release build
        run: |
          bash scripts/build.sh ci
          cd dist && sha256sum -c SHA256SUMS

      - name: zizmor on this workflow
        run: pipx run zizmor==1.31.1 --offline .github/workflows/
