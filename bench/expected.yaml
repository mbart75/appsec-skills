# Each entry is one seeded flaw.
#   file          path inside the application
#   anchor        exact text on the vulnerable line (checked by bench/check-key.py)
#   same_in_secure  "true" when the flaw is an absence, so the anchor line legitimately exists in both variants
#   cwe / ref     classification
#   severity_min  lowest acceptable rating (Critical > High > Medium > Low > Info)
#   scanners      tools that caught it in a real run; "review" means only reasoning finds it.
#                 Measured on 2026-10-16 with skills/appsec-review/scripts/run-scanners.sh --history:
#                 gitleaks 8.30, TruffleHog 3.99, Semgrep 1.181 (p/default), Bandit 1.9, ShellCheck,
#                 PSScriptAnalyzer 1.25, OSV-Scanner 2.7, Checkov 3.3, Trivy 0.72, zizmor 1.31.
#                 Result: 16 of 35 flaws caught by at least one scanner, 19 need reasoning.
#   modes         review modes expected to find it (diff covers a review of the full tree as one change)

