# For bench/secure-app. Reporting any of these as a vulnerability is a false positive.
secure_app_traps:
  - id: T01
    file: public/config.js
    what: Supabase anon key in the browser. Public by design; access is enforced by RLS. Scanners flag it as a JWT.
  - id: T02
    file: supabase/schema.sql
    what: RLS enabled with no policy on most tables. That means deny all for anon, not "missing policies".
  - id: T03
    file: server/routes/products.js
    what: "ILIKE '%' || $1 || '%' is a bound parameter, not SQL injection."
  - id: T04
    file: server/routes/auth.js
    what: DUMMY_HASH is a timing equaliser, not a hard-coded credential.
  - id: T05
    file: infra/main.tf
    what: Bucket policy with Principal "*" is a Deny on insecure transport, not public access.
  - id: T06
    file: .github/workflows/pr-check.yml
    what: Actions pinned by full commit SHA with the version in a comment.
  - id: T07
    file: infra/main.tf
    what: Egress to 0.0.0.0/0 on port 443 only, needed for the payment, mail and LLM APIs. Trivy rates it CRITICAL (AWS-0104); Info or Low at most.

# Valid observations on secure-app. Not counted as false positives if rated Low or Info.
secure_app_accepted:
  - No lockfile committed (the fixture is not meant to be installed).
  - No MFA for admin accounts.
  - IP-based rate limiting may need trust proxy settings behind a load balancer.
  - No CSRF token (mitigated by SameSite=Lax, JSON bodies and a strict CORS allow-list).
  - LLM provider-side spending cap not visible in code.
  - S3 access logging or customer-managed KMS key.
  - server/payments.js no longer used.
  - Link preview reads the whole response before truncating it.
